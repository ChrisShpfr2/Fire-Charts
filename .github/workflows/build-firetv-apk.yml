name: Build Amazon Fire TV APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "android-tv/apk/**"
  workflow_dispatch:
    inputs:
      terminal_url:
        description: "Optional fallback server URL (bundled standalone app runs natively by default)"
        required: false
        default: "https://ais-pre-foywkngep6ipdhdrjifkll-853935803100.europe-west2.run.app"

permissions:
  contents: write

concurrency:
  group: build-firetv-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build bundled web terminal for native Fire TV APK
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
          npm run build
          rm -rf android-tv/app/src/main/assets
          mkdir -p android-tv/app/src/main/assets
          cp -R dist/. android-tv/app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK (API 34)
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in $SDK_DIR/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Fire TV Debug & Release APKs
        working-directory: android-tv
        env:
          TERMINAL_URL: ${{ github.event.inputs.terminal_url || vars.TERMINAL_URL || 'https://ais-pre-foywkngep6ipdhdrjifkll-853935803100.europe-west2.run.app' }}
        run: gradle --no-daemon assembleDebug assembleRelease -PTERMINAL_URL="$TERMINAL_URL"

      - name: Prepare APK output file
        run: |
          mkdir -p android-tv/apk
          cp android-tv/app/build/outputs/apk/release/app-release.apk android-tv/apk/apex-4k-firetv.apk

      - name: Upload Fire TV APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-4k-firetv-apk
          path: |
            android-tv/apk/apex-4k-firetv.apk
            android-tv/app/build/outputs/apk/release/*.apk
            android-tv/app/build/outputs/apk/debug/*.apk

      - name: Commit compiled APK to repository
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-tv/apk/apex-4k-firetv.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update compiled Fire TV APK [skip ci]"
            git push
          fi

      - name: Publish direct APK download on GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA="$(git rev-parse HEAD)"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest android-tv/apk/apex-4k-firetv.apk --clobber
          else
            gh release create latest android-tv/apk/apex-4k-firetv.apk \
              --target "$TARGET_SHA" \
              --title "Apex 4K Financial TV — Fire TV APK" \
              --notes "Latest signed standalone Amazon Fire TV Leanback APK."
          fi
